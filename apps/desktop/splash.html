<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>TETRA</title>
    <style>
      /* While the game loads: the T drops in block by block, then a bar of minos fills under it. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(55% 65% at 50% 42%, rgb(237 235 250 / 0.08), transparent 70%), #000;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      svg {
        width: 104px;
        height: 104px;
        overflow: visible;
        filter: drop-shadow(0 18px 40px rgb(237 235 250 / 0.18));
      }
      svg rect {
        fill: #fbfbfc;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: drop 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
      }
      svg rect:nth-child(1) { animation-delay: 0.1s; }
      svg rect:nth-child(2) { animation-delay: 0.22s; }
      svg rect:nth-child(3) { animation-delay: 0.34s; }
      svg rect:nth-child(4) { animation-delay: 0.5s; }
      /* The bar: ten minos that light up in turn, then keep a slow shimmer running while the game finishes loading. */
      .bar {
        display: flex;
        gap: 5px;
        margin-top: 44px;
        opacity: 0;
        animation: fade 0.4s ease-out 0.75s forwards;
      }
      .bar i {
        width: 12px;
        height: 12px;
        border-radius: 3.5px;
        background: rgb(255 255 255 / 0.07);
        box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.06);
        animation:
          fill 0.35s cubic-bezier(0.2, 1.2, 0.4, 1) forwards,
          shimmer 1.6s ease-in-out infinite;
        animation-delay: calc(0.9s + var(--i) * 0.13s), calc(2.4s + var(--i) * 0.08s);
      }
      @keyframes drop {
        from { opacity: 0; transform: translateY(-46px) scale(0.9); }
        60% { opacity: 1; }
        to { opacity: 1; transform: none; }
      }
      @keyframes fade {
        to { opacity: 1; }
      }
      @keyframes fill {
        from { transform: scale(0.6); }
        to { transform: none; background: rgb(251 251 252 / 0.92); box-shadow: 0 0 14px rgb(237 235 250 / 0.35); }
      }
      @keyframes shimmer {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0s !important; }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="12" width="17" height="17" rx="4.5" />
        <rect x="23.5" y="12" width="17" height="17" rx="4.5" />
        <rect x="43" y="12" width="17" height="17" rx="4.5" />
        <rect x="23.5" y="31.5" width="17" height="17" rx="4.5" />
      </svg>
      <div class="bar" aria-label="Loading">
        <i style="--i: 0"></i><i style="--i: 1"></i><i style="--i: 2"></i><i style="--i: 3"></i><i style="--i: 4"></i>
        <i style="--i: 5"></i><i style="--i: 6"></i><i style="--i: 7"></i><i style="--i: 8"></i><i style="--i: 9"></i>
      </div>
    </div>
  </body>
</html>
