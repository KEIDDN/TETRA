<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
    <title>TETRA</title>
    <style>
      /* The first thing TETRA shows while the game loads: the mark drops in block by block, the name follows. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fbfbfc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-app-region: drag;
      }
      body {
        display: grid;
        place-items: center;
        background: radial-gradient(60% 70% at 50% 45%, rgb(237 235 250 / 0.07), transparent 70%), #000;
      }
      .stage {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      svg {
        width: 92px;
        height: 92px;
        overflow: visible;
      }
      rect {
        fill: #fbfbfc;
        opacity: 0;
        transform-box: fill-box;
        transform-origin: center;
        animation: drop 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
      }
      rect:nth-child(1) {
        animation-delay: 0.1s;
      }
      rect:nth-child(2) {
        animation-delay: 0.22s;
      }
      rect:nth-child(3) {
        animation-delay: 0.34s;
      }
      rect:nth-child(4) {
        animation-delay: 0.5s;
      }
      .glow {
        position: absolute;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(237 235 250 / 0.22), transparent 65%);
        opacity: 0;
        animation: pulse 1.4s ease-out 0.85s forwards;
        pointer-events: none;
      }
      .name {
        margin-top: 26px;
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.5em;
        padding-left: 0.5em;
        opacity: 0;
        animation: name 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
      }
      .by {
        margin-top: 12px;
        font: 500 10px/1 ui-monospace, 'SF Mono', Menlo, monospace;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        text-transform: uppercase;
        color: rgb(255 255 255 / 0.4);
        opacity: 0;
        animation: fade 0.8s ease-out 1.25s forwards;
      }
      .bar {
        margin-top: 34px;
        width: 120px;
        height: 2px;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
        opacity: 0;
        animation: fade 0.5s ease-out 1.3s forwards;
      }
      .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: rgb(255 255 255 / 0.7);
        animation: run 1.1s ease-in-out infinite;
      }
      @keyframes drop {
        from {
          opacity: 0;
          transform: translateY(-46px) scale(0.9);
        }
        60% {
          opacity: 1;
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes name {
        from {
          opacity: 0;
          letter-spacing: 1.1em;
          filter: blur(6px);
        }
        to {
          opacity: 1;
          letter-spacing: 0.5em;
          filter: blur(0);
        }
      }
      @keyframes fade {
        to {
          opacity: 1;
        }
      }
      @keyframes pulse {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        40% {
          opacity: 1;
        }
        100% {
          opacity: 0.35;
          transform: scale(1.15);
        }
      }
      @keyframes run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-delay: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="stage">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <rect x="4" y="12" width="17" height="17" rx="4.5" />
        <rect x="23.5" y="12" width="17" height="17" rx="4.5" />
        <rect x="43" y="12" width="17" height="17" rx="4.5" />
        <rect x="23.5" y="31.5" width="17" height="17" rx="4.5" />
      </svg>
      <div class="name">TETRA</div>
      <div class="by">OXIA Labs</div>
      <div class="bar"></div>
    </div>
  </body>
</html>
